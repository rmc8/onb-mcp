[project]
name = "onb-mcp"
version = "0.4.4"
description = "MCP server that wraps the Open Notebook API"
authors = [
    { name = "rmc8" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.3.0",
]

[project.urls]
Repository = "https://github.com/rmc8/onb-mcp"
Homepage = "https://github.com/rmc8/onb-mcp"

[project.scripts]
onb-mcp = "onb_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.15.21",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"
